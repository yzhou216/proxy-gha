name: qemu-vm-tailnet

on:
  workflow_dispatch:
    inputs:
      tailnet:
        description: 'Tailscale tailnet name for Admin API device cleanup'
        required: true
        type: string
      keepalive_seconds:
        description: 'How long to keep the VM alive after join (default 21540)'
        required: false
        default: '21540'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          witness-carnage: true
          root-safe-haven: 4096
      - name: Prepare token (parallel)
        id: token
        background: true
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: scripts/boot-and-join.sh placeholder token
      - name: Prepare reclaim (parallel)
        id: reclaim
        background: true
        env:
          TS_RECLAIM_CLIENT_ID: ${{ secrets.TS_RECLAIM_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          TS_TAILNET: ${{ inputs.tailnet }}
        run: scripts/boot-and-join.sh placeholder reclaim
      - name: Prepare qemu (parallel)
        id: qemu
        background: true
        run: scripts/boot-and-join.sh placeholder qemu
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Runner preflight
        run: |
          echo "=== df ==="; df -h
          echo "=== disk on / ==="; df -h / | tail -1
          echo "=== tools ==="
          for t in python3 curl jq sudo tee nix qemu-system-x86_64; do
            if command -v "$t" >/dev/null 2>&1; then echo "$t: OK ($(command -v $t))"; else echo "$t: MISSING"; fi
            done
      - name: Prepare image (parallel)
        id: image
        background: true
        env:
          NIXOS_DISK_IMAGE_MEM: "4096"
        run: |
          image=$(scripts/build-image.sh)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Wait for parallel prepare
        wait:
          - image
          - qemu
          - token
          - reclaim
      - name: Boot stage - stage disk and resize to 130GB
        run: scripts/boot-and-join.sh "${{ env.image }}" disk
      - name: Boot stage - boot VM and join tailnet
        timeout-minutes: 359
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_KEEPALIVE_SECONDS: ${{ inputs.keepalive_seconds }}
        run: scripts/boot-and-join.sh "${{ env.image }}" boot
      - name: Collect boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diagnostics
          path: |
            /nix/vm/boot-transcript.*.log
            /nix/vm/qemu.log
            /nix/vm/qemu.err
            /nix/vm/qemu.out
            /nix/vm/share/login-status
          if-no-files-found: warn
