name: qemu-vm-tailnet

on:
  workflow_dispatch:
    inputs:
      tailnet:
        description: 'Tailscale tailnet name for Admin API device cleanup'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          witness-carnage: true
          root-safe-haven: 4096
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build minimal QCOW2 image
        env:
          NIXOS_DISK_IMAGE_MEM: "4096"
        run: |
          image=$(scripts/build-image.sh)
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Runner preflight
        run: |
          echo "=== df ==="; df -h
          echo "=== disk on / ==="; df -h / | tail -1
          echo "=== tools ==="
          for t in python3 curl jq sudo tee nix; do
            if command -v "$t" >/dev/null 2>&1; then echo "$t: OK ($(command -v $t))"; else echo "$t: MISSING"; fi
            done
      - name: Boot stage 1 - OIDC token via 9p share
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: scripts/boot-and-join.sh "${{ env.image }}" token
      - name: Boot stage 2 - reclaim stale gha-qemu hostname
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          TS_TAILNET: ${{ inputs.tailnet }}
        run: scripts/boot-and-join.sh "${{ env.image }}" reclaim
      - name: Boot stage 3 - provision qemu via nix
        run: scripts/boot-and-join.sh "${{ env.image }}" qemu
      - name: Boot stage 4 - stage disk and resize to 130GB
        run: scripts/boot-and-join.sh "${{ env.image }}" disk
      - name: Boot stage 5 - boot VM and join tailnet
        id: boot
        timeout-minutes: 359
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: scripts/boot-and-join.sh "${{ env.image }}" boot
      - name: Collect boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diagnostics
          path: |
            /nix/vm/boot-transcript.log
            /nix/vm/qemu.log
            /nix/vm/qemu.err
            /nix/vm/qemu.out
            /nix/vm/share/login-status
          if-no-files-found: warn