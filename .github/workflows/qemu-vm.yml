name: qemu-vm-tailnet

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          witness-carnage: true
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build minimal QCOW2 image
        env:
          NIXOS_DISK_IMAGE_MEM: "4096"
        run: |
          image=$(scripts/build-image.sh)
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Boot NixOS VM and join tailnet
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: scripts/boot-and-join.sh "${{ env.image }}"