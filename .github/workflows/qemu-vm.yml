name: qemu-vm-tailnet

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Create NixOS configuration and flake
        run: |
          mkdir -p /tmp/nixos
          cat > /tmp/nixos/configuration.nix <<'EOF'
          { pkgs, ... }:
          {
            virtualisation.diskSize = 10 * 1024;
            boot.growPartition = true;
            boot.kernelModules = [ "9p" "9pnet_virtio" ];
            boot.initrd.availableKernelModules = [ "virtio_pci" "virtio_blk" "virtio_net" "9p" "9pnet_virtio" ];
            boot.kernelParams = [ "console=ttyS0,115200" ];
            systemd.network.enable = true;
            systemd.network.networks."10-lan" = {
              matchConfig.Name = "*";
              networkConfig.DHCP = "yes";
            };
            fileSystems."/share" = {
              device = "share";
              fsType = "9p";
              options = [ "trans=virtio" "version=9p2000.L" "cache=loose" ];
            };
            services.tailscale.enable = true;
            networking.hostName = "gha-qemu";
            users.users.yiyu = {
              isNormalUser = true;
              extraGroups = [ "wheel" ];
              hashedPassword = "$6$yM8t/1VCAl66Y7XD$dmvt7Xq6iGLU3uJ9lcpUvr/7PZxt7IzYsoZbm4s42pejndU4IAMW4YbP4JcQK5KxI5DzSwLjPFCYY/OETznnO1";
            };
            systemd.services.ts-login = {
              description = "Tailscale login with secrets from the 9p share";
              wantedBy = [ "multi-user.target" ];
              after = [ "network-online.target" "tailscaled.service" ];
              wants = [ "network-online.target" ];
              serviceConfig.Type = "oneshot";
              serviceConfig.RemainAfterExit = true;
              script = ''
                set -x
                for i in $(seq 1 40); do
                  test -f /share/client-id -a -f /share/id-token && break
                  sleep 3
                done
                for i in $(seq 1 20); do
                  CLIENT_ID=$(cat /share/client-id 2>/dev/null)
                  ID_TOKEN=$(cat /share/id-token 2>/dev/null)
                  if test -n "$CLIENT_ID" -a -n "$ID_TOKEN"; then
                    if tailscale up \
                      --client-id="$CLIENT_ID?preauthorized=true&ephemeral=true" \
                      --id-token="$ID_TOKEN" \
                      --advertise-tags=tag:ci \
                      --hostname=gha-qemu \
                      --ssh; then
                      touch /share/login-ok
                      break
                    fi
                  fi
                  sleep 5
                done
                tailscale status > /share/login-status 2>&1 || true
              '';
            };
            systemd.services.vm-ready = {
              wantedBy = [ "multi-user.target" ];
              serviceConfig.Type = "oneshot";
              script = "echo VM-READY > /dev/console";
            };
            environment.systemPackages = with pkgs; [
            ];
          }
          EOF
          cat > /tmp/nixos/flake.nix <<'EOF'
          {
            inputs = {
              nixpkgs.url = "nixpkgs/nixos-unstable";
            };
            outputs = { self, nixpkgs, ... }:
            let
              system = "x86_64-linux";
            in
            {
              nixosConfigurations.gha-qemu = nixpkgs.lib.nixosSystem {
                inherit system;
                modules = [
                  ({ modulesPath, ... }: {
                    imports = [ "${modulesPath}/image/images.nix" ];
                  })
                  ./configuration.nix
                ];
              };
            };
          }
          EOF

      - name: Build minimal QCOW2 image
        env:
          NIXOS_DISK_IMAGE_MEM: "4096"
        run: |
          image=$(nix run nixpkgs#nixos-rebuild -- build-image \
            --flake /tmp/nixos#gha-qemu \
            --image-variant qemu \
            --accept-flake-config | head -1)
          echo "image=$image" >> "$GITHUB_ENV"

      - name: Boot NixOS VM and join tailnet
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -x
          mkdir -p /tmp/share
          printf '%s' "$TS_OAUTH_CLIENT_ID" > /tmp/share/client-id
          fetch_token() {
            aud_enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TS_AUDIENCE")
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud_enc" | jq -r .value
          }
          printf '%s' "$(fetch_token)" > /tmp/share/id-token
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          cp "${{ env.image }}" /tmp/image.qcow2
          chmod +w /tmp/image.qcow2
          accel=(-accel tcg,thread=multi)
          test -e /dev/kvm && accel=(-accel kvm -cpu host)
          qemu-system-x86_64 \
            "${accel[@]}" \
            -m 2048 \
            -smp 4 \
            -drive file=/tmp/image.qcow2,if=virtio,format=qcow2 \
            -nic user,model=virtio,hostfwd=tcp::2222-:22 \
            -virtfs local,path=/tmp/share,mount_tag=share,security_model=none \
            -display none -serial file:qemu.log > qemu.out 2> qemu.err &
          qemu_pid=$!
          vm_ready=no
          ok=no
          deadline=$((SECONDS + 1200))
          while [ $SECONDS -lt $deadline ]; do
            printf '%s' "$(fetch_token)" > /tmp/share/id-token
            if grep -q VM-READY qemu.log 2>/dev/null; then
              vm_ready=yes
            fi
            if [ -f /tmp/share/login-ok ]; then
              ok=yes
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "qemu exited early"
              break
            fi
            sleep 10
          done
          echo "vm_ready=$vm_ready login=$ok"
          echo "=== login-status ==="
          cat /tmp/share/login-status 2>/dev/null || true
          echo "=== qemu.err ==="
          tail -40 qemu.err 2>/dev/null || true
          echo "=== qemu.log ==="
          tail -60 qemu.log 2>/dev/null || true
          if [ "$ok" = yes ]; then
            echo "VM joined tailnet, keeping it alive 10 minutes before shutdown"
            sleep 600
          fi
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test "$ok" = yes